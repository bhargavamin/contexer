<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Contexer adoption benchmark, Sonnet 5.5, 1,242 sessions scored by code. Cost per session as stored rules grow from 34 to 150: CLAUDE.md $0.080 to $0.109, indexed docs $0.075 to $0.103, Contexer $0.066 to $0.076, with accuracy level across the three (Contexer 109 of 114 tasks at 150 rules, the others 108). When two current rules contradict, Contexer asked the developer in 12 of 12 runs, CLAUDE.md and indexed docs in 7 of 12. Not yet solved: rules stated during a session reached the store in 6 of 24 runs.">
