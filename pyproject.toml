[project]
name = "contexer"
version = "0.33.2"
description = "MCP server that preserves decisions and context across AI coding sessions"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Bhargav Amin", email = "devops.techpro@gmail.com"},
]
keywords = ["mcp", "claude", "codex", "gemini", "cursor", "context", "decisions", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Upper bound is load-bearing, not caution: mcp 2.0.0 removed `mcp.server.fastmcp`
    # (FastMCP moved to its own `fastmcp` distribution and mcp 2.x pulls `mcp-types`),
    # so server.py's import dies at startup. Unbounded, a fresh `uv tool install` /
    # `pip install contexer` resolves 2.x and ships a server that cannot start, while
    # this repo's uv.lock (mcp 1.27.2) keeps every dev command green — the break is
    # invisible from source. Lift only together with the FastMCP 2.x migration.
    "mcp>=1.9.4,<2",
]

[project.scripts]
contexer = "contexer.cli:main"

[project.urls]
Homepage = "https://github.com/bhargavamin/contexer"
Repository = "https://github.com/bhargavamin/contexer"
Issues = "https://github.com/bhargavamin/contexer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contexer"]

[tool.uv]
# Pin a uv floor so an older uv can't silently rewrite uv.lock back to an
# earlier `revision` (revision 3 / upload-time metadata landed in the uv 0.8.x
# line). Without this the lockfile flip-flops between revisions on every sync.
required-version = ">=0.8.0"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
# The lint gate CI enforces (.github/workflows/test.yml). Ruff is not a dev-group
# dependency on purpose: it is a standalone binary, never imported, so CI and
# CONTRIBUTING both invoke it as `uvx ruff@<exact version> check` — pinned like every
# other tool here, and no uv.lock churn when it is bumped.
target-version = "py312"          # matches requires-python; never inferred from the local interpreter
# Deliberately NO line-length: E501 is not selected (comment-heavy modules run past
# any bound worth setting), and declaring one would make miner._emit_ruff advertise a
# "Line length N enforced by ruff" convention this repo does not actually enforce.

[tool.ruff.lint]
# Ruff's current default set, spelled out on purpose: a future ruff release widening
# its defaults must arrive as an explicit commit here, not as a red PR nobody changed.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under must stay HERE, not on the CI command line: addopts is the
# only key contexer/miner.py mines the coverage floor from, so relocating the
# flag silently deletes this repo's own "coverage ≥85%" convention (enforced
# by test_own_repo_coverage_floor_stays_minable). Known cost: subset runs
# exit 1 on coverage — pass --no-cov (see CONTRIBUTING.md).
addopts = "--cov=contexer --cov-report=term-missing --cov-fail-under=85"
markers = [
    "slow: benchmark-harness tests (tests/test_bench_*.py), deselected in the PR gate",
    "perf: wall-clock latency assertions — meaningful only on fixed hardware, never in CI",
]

[tool.coverage.run]
omit = [
    "contexer/server.py",   # MCP entry point — thin wrappers, tested via store
    "contexer/__main__.py", # CLI entry point
]
