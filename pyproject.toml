[project]
name = "contexer"
version = "0.10.0"
description = "MCP server that preserves decisions and context across AI coding sessions"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Bhargav Amin", email = "devops.techpro@gmail.com"},
]
keywords = ["mcp", "claude", "codex", "gemini", "cursor", "context", "decisions", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.9.4",
]

[project.scripts]
contexer = "contexer.cli:main"

[project.urls]
Homepage = "https://github.com/bhargavamin/contexer"
Repository = "https://github.com/bhargavamin/contexer"
Issues = "https://github.com/bhargavamin/contexer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contexer"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=contexer --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = [
    "contexer/server.py",   # MCP entry point — thin wrappers, tested via store
    "contexer/__main__.py", # CLI entry point
]
