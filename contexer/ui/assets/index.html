<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Contexer Console</title>
    <link rel="stylesheet" href="/console.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="brand">
            <svg
              class="brand-glyph"
              width="17"
              height="17"
              viewBox="0 0 15 15"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <ellipse cx="7.5" cy="3.75" rx="4.5" ry="1.75" />
              <path d="M3 3.75v3.25c0 .97 2.02 1.75 4.5 1.75S12 7.97 12 7V3.75" />
              <path d="M3 7v3.25C3 11.22 5.02 12 7.5 12S12 11.22 12 10.25V7" />
            </svg>
            <span>contexer<span class="brand-accent">.</span>console</span>
          </span>
        </div>

        <div class="switcher-wrap">
          <div class="sidebar-section">Repository</div>
          <details class="switcher" id="switcher">
            <summary class="switcher-btn">
              <span class="switcher-emblem mono" id="switcher-emblem" aria-hidden="true">–</span>
              <span class="switcher-ident">
                <span class="switcher-name" id="switcher-name">loading</span>
                <span class="switcher-meta mono" id="switcher-meta"></span>
              </span>
              <svg
                class="switcher-caret"
                width="12"
                height="12"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 6l3.5 3.5L11 6" />
              </svg>
            </summary>
            <div class="switcher-menu" id="switcher-menu"></div>
          </details>
        </div>

        <nav class="nav" id="nav" aria-label="Console sections">
          <a class="nav-item" data-nav="dashboard" href="#/config">
            <span class="nav-icon">
              <svg
                width="15"
                height="15"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="1.5" y="1.5" width="5" height="5" rx="1" />
                <rect x="8.5" y="1.5" width="5" height="5" rx="1" />
                <rect x="1.5" y="8.5" width="5" height="5" rx="1" />
                <rect x="8.5" y="8.5" width="5" height="5" rx="1" />
              </svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </a>
          <a class="nav-item" data-nav="decisions" href="#/config">
            <span class="nav-icon">
              <svg
                width="15"
                height="15"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <ellipse cx="7.5" cy="3.75" rx="4.5" ry="1.75" />
                <path d="M3 3.75v3.25c0 .97 2.02 1.75 4.5 1.75S12 7.97 12 7V3.75" />
                <path d="M3 7v3.25C3 11.22 5.02 12 7.5 12S12 11.22 12 10.25V7" />
              </svg>
            </span>
            <span class="nav-label">Decisions</span>
            <span class="nav-badge" data-count="decisions" hidden></span>
          </a>
          <a class="nav-item" data-nav="review" href="#/config">
            <span class="nav-icon">
              <svg
                width="15"
                height="15"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 8.25 5.5 11.75 13 3" />
              </svg>
            </span>
            <span class="nav-label">Review</span>
            <span class="nav-badge" data-count="pending" hidden></span>
          </a>
          <div class="nav-separator" role="none"></div>
          <a class="nav-item" data-nav="global" href="#/global">
            <span class="nav-icon">
              <svg
                width="15"
                height="15"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="7.5" cy="7.5" r="6" />
                <path d="M1.5 7.5h12M7.5 1.5c1.9 2 1.9 10 0 12M7.5 1.5c-1.9 2-1.9 10 0 12" />
              </svg>
            </span>
            <span class="nav-label">Global rules</span>
            <span class="nav-badge" data-count="global" hidden></span>
          </a>
          <a class="nav-item" data-nav="team" href="#/config">
            <span class="nav-icon">
              <svg
                width="15"
                height="15"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="5" cy="4.25" r="2.25" />
                <path d="M1 12.5a4 4 0 0 1 8 0" />
                <circle cx="11.25" cy="4.25" r="2" />
                <path d="M11.25 8.75a3.75 3.75 0 0 1 2.75 3.75" />
              </svg>
            </span>
            <span class="nav-label">Team</span>
            <span class="nav-badge" data-count="team" hidden></span>
          </a>
          <div class="nav-separator" role="none"></div>
          <a class="nav-item" data-nav="deleted" href="#/config">
            <span class="nav-icon">
              <svg
                width="15"
                height="15"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.5 4h10M5.5 4V2.5h4V4M4 4l.7 9h5.6l.7-9" />
              </svg>
            </span>
            <span class="nav-label">Deleted</span>
            <span class="nav-badge" data-count="deleted" hidden></span>
          </a>
          <a class="nav-item" data-nav="config" href="#/config">
            <span class="nav-icon">
              <svg
                width="15"
                height="15"
                viewBox="0 0 15 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="7.5" cy="7.5" r="2.25" />
                <path
                  d="M7.5 1.5v1.6M7.5 11.9v1.6M1.5 7.5h1.6M11.9 7.5h1.6M3.3 3.3l1.1 1.1M10.6 10.6l1.1 1.1M11.7 3.3l-1.1 1.1M4.4 10.6l-1.1 1.1"
                />
              </svg>
            </span>
            <span class="nav-label">Config</span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <span class="foot-line mono muted" id="version-line">contexer</span>
          <span class="foot-line mono muted" id="port-line"></span>
        </div>
      </aside>

      <main class="main">
        <div class="main-inner" id="view">
          <div class="loading muted mono">loading</div>
        </div>
      </main>
    </div>

    <div class="banner" id="banner" role="alert" hidden>
      <span class="banner-dot" aria-hidden="true"></span>
      <span class="banner-text" id="banner-text">Disconnected from the Contexer daemon.</span>
      <button class="btn btn-ghost btn-sm" id="banner-retry" type="button">Retry</button>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <template id="tpl-check">
      <svg
        class="check"
        width="13"
        height="13"
        viewBox="0 0 15 15"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 8.25 5.5 11.75 13 3" />
      </svg>
    </template>

    <template id="tpl-empty-glyph">
      <svg
        class="empty-glyph"
        width="28"
        height="28"
        viewBox="0 0 15 15"
        fill="none"
        stroke="currentColor"
        stroke-width="1.1"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <ellipse cx="7.5" cy="3.75" rx="4.5" ry="1.75" />
        <path d="M3 3.75v3.25c0 .97 2.02 1.75 4.5 1.75S12 7.97 12 7V3.75" />
        <path d="M3 7v3.25C3 11.22 5.02 12 7.5 12S12 11.22 12 10.25V7" />
      </svg>
    </template>

    <script src="/console.js" defer></script>
  </body>
</html>
