name: "Contexer Check"
description: >-
  Judges this PR's diff against your team's approved Contexer decisions with an LLM (on your own
  Anthropic key), posts an advisory drift score as a sticky PR comment, and reports the result to
  the Contexer dashboard.
branding:
  icon: "shield"
  color: "purple"

inputs:
  contexer_url:
    description: "Base URL of the Contexer server (e.g. https://mcp.contexer.ai)."
    required: true
  contexer_ci_token:
    description: >-
      Team CI token (cci_...), minted lead-only in the Contexer dashboard. Store as a repo secret
      (e.g. CONTEXER_CI_TOKEN) - never commit it.
    required: true
  anthropic_api_key:
    description: >-
      Your team's own Anthropic API key. The judge LLM call runs in this job, on this key -
      Contexer never sees the diff or the key. Store as a repo secret (e.g. ANTHROPIC_API_KEY).
      Required when `provider` is unset or "anthropic" (the default); ignored otherwise.
    required: false
    default: ""
  provider:
    description: >-
      BYOK provider for the judge/router LLM calls: "anthropic" (default), "openai", or "kimi"
      (Moonshot's Kimi models, reached over the same OpenAI-compatible API as "openai"). Maps to
      CONTEXER_LLM_PROVIDER.
    required: false
    default: ""
  openai_api_key:
    description: >-
      Your team's own OpenAI API key. Required when `provider` is "openai"; ignored otherwise.
      Store as a repo secret (e.g. OPENAI_API_KEY).
    required: false
    default: ""
  kimi_api_key:
    description: >-
      Your team's own Moonshot (Kimi) API key. Required when `provider` is "kimi"; ignored
      otherwise. Store as a repo secret (e.g. KIMI_API_KEY).
    required: false
    default: ""
  llm_base_url:
    description: >-
      Override the selected provider's default API endpoint - for a self-hosted or proxied
      OpenAI-compatible gateway (e.g. LiteLLM). Unset uses the provider's own default. Maps to
      CONTEXER_LLM_BASE_URL.
    required: false
    default: ""
  fail_below:
    description: >-
      Drift score threshold (0-100). Unset (default) = advisory only, the check always passes.
      When set, a score below the threshold fails the check, AND infra/LLM/auth errors fail closed
      (see fail_on_error to relax that). Maps to CONTEXER_FAIL_BELOW.
    required: false
    default: ""
  model:
    description: >-
      Anthropic model id for the judge. Defaults to the CLI's own default (claude-opus-5) when
      unset. claude-sonnet-5 is a cheaper option (roughly 5x less). Maps to CONTEXER_MODEL.
    required: false
    default: ""
  router:
    description: >-
      Relevance pre-pass. Default on: a cheap model first picks which decisions could be affected by
      the changed files, so the judge only scores decisions in scope for this PR (less cost, sharper
      signal). Set to "0" to judge every decision every time. Maps to CONTEXER_ROUTER.
    required: false
    default: ""
  router_model:
    description: >-
      Anthropic model id for the relevance pre-pass. Defaults to the CLI's own default
      (claude-haiku-4-5) when unset - keep this cheap. Maps to CONTEXER_ROUTER_MODEL.
    required: false
    default: ""
  web_url:
    description: >-
      Base URL of the Contexer dashboard, used only to add a "view in dashboard" link in the PR
      comment. Omit to leave the link out. Maps to CONTEXER_WEB_URL.
    required: false
    default: ""
  fail_on_error:
    description: >-
      Overrides the fail_below error-handling default. With fail_below set, infra/LLM/auth errors
      fail closed (exit 2) by default; set this to "0" to relax that back to a warning (exit 0).
      With fail_below unset the check is always advisory regardless of this input. Maps to
      CONTEXER_FAIL_ON_ERROR.
    required: false
    default: ""
  report_explanations:
    description: >-
      Default on: sends each finding's verdict explanation (may quote small snippets of diff
      content) to Contexer along with the score. Set to "0" to report verdicts + file paths only.
      Maps to CONTEXER_REPORT_EXPLANATIONS.
    required: false
    default: ""
  dry_run:
    description: >-
      Set to "1" to print the would-be PR comment to the job log instead of posting it or
      reporting to Contexer. Useful for testing the setup. Maps to CONTEXER_DRY_RUN.
    required: false
    default: ""
  max_diff_bytes:
    description: >-
      Byte budget for the judged diff before whole files start getting dropped as "truncated".
      Defaults to the CLI's own default (800000) when unset. Maps to CONTEXER_MAX_DIFF_BYTES.
    required: false
    default: ""
  max_chunks:
    description: >-
      Max number of ~50k-char chunks the diff is batched into for the judge. Defaults to the
      CLI's own default (8) when unset. Maps to CONTEXER_MAX_CHUNKS.
    required: false
    default: ""
  ignore_globs:
    description: >-
      Comma-separated extra glob patterns to exclude from the judged diff, appended to the CLI's
      built-in ignore set (lockfiles, dist/, *.snap, etc). Maps to CONTEXER_IGNORE_GLOBS.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Pinned to a full commit SHA (not the mutable `v4` tag) - this step runs in the consumer job
    # right before the credential-bearing CLI step, so a moved upstream tag must not silently change
    # the code that prepares the runner. SHA = actions/setup-node v4; bump deliberately.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"

    # Pin here, once. Keep in lockstep with packages/check/package.json "version" (R20 - never
    # reference an unpinned `npx @contexer-ai/contexer-check` anywhere, in this file or in the
    # docs). Published as a scoped package (org-scoped publish permissions); the bin name stays
    # the short, unscoped "contexer-check" (package.json "bin" field), so npx still installs a
    # command invokable as `contexer-check` below.
    - name: Pin contexer-check version
      id: pin
      shell: bash
      run: echo "version=0.4.0" >> "$GITHUB_OUTPUT"

    # R18: preflight the package resolution/install in isolation, running a no-op ("true") instead
    # of the real bin. A nonzero exit here is unambiguously an npm/registry/network failure - the
    # CLI itself never ran, so its own fail-open/fail-closed logic never got a chance to apply.
    # `continue-on-error` lets the next step decide what to do with that outcome instead of the
    # runner turning the whole job red on its own.
    - name: Preflight install
      id: preflight
      shell: bash
      continue-on-error: true
      run: npx --yes --package="@contexer-ai/contexer-check@${{ steps.pin.outputs.version }}" -c "true"

    # Only reached when preflight failed. Advisory (no fail_below) => warn + exit 0. Blocking
    # (fail_below set) => fail closed (exit 2) unless fail_on_error explicitly relaxes it - the same
    # rule the CLI itself applies to its own infra errors (cli.ts errorExit), so an install outage
    # and a runtime outage are treated identically.
    - name: Handle install failure (advisory-safe)
      if: steps.preflight.outcome == 'failure'
      shell: bash
      env:
        FAIL_BELOW: ${{ inputs.fail_below }}
        FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
      run: |
        relaxed=false
        case "${FAIL_ON_ERROR,,}" in
          0|false|off|no) relaxed=true ;;
        esac
        if [ -n "$FAIL_BELOW" ] && [ "$relaxed" != "true" ]; then
          echo "::error::contexer-check could not be installed (registry/network) and fail_below is set - failing closed."
          exit 2
        fi
        echo "::warning::contexer-check could not be installed (registry/network outage) - skipping this advisory run."
        exit 0

    # The real run. Only reached when preflight succeeded, so this is the CLI's own decision to
    # make; its exit code (0 advisory / 1 below-threshold / 2 fail-closed error) passes through
    # untouched - the shim never overrides a deliberate CLI outcome, only an install failure above.
    - name: Run contexer-check
      if: steps.preflight.outcome == 'success'
      shell: bash
      env:
        CONTEXER_URL: ${{ inputs.contexer_url }}
        CONTEXER_CI_TOKEN: ${{ inputs.contexer_ci_token }}
        CONTEXER_LLM_PROVIDER: ${{ inputs.provider }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        KIMI_API_KEY: ${{ inputs.kimi_api_key }}
        CONTEXER_LLM_BASE_URL: ${{ inputs.llm_base_url }}
        CONTEXER_FAIL_BELOW: ${{ inputs.fail_below }}
        CONTEXER_MODEL: ${{ inputs.model }}
        CONTEXER_ROUTER: ${{ inputs.router }}
        CONTEXER_ROUTER_MODEL: ${{ inputs.router_model }}
        CONTEXER_WEB_URL: ${{ inputs.web_url }}
        CONTEXER_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        CONTEXER_REPORT_EXPLANATIONS: ${{ inputs.report_explanations }}
        CONTEXER_DRY_RUN: ${{ inputs.dry_run }}
        CONTEXER_MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
        CONTEXER_MAX_CHUNKS: ${{ inputs.max_chunks }}
        CONTEXER_IGNORE_GLOBS: ${{ inputs.ignore_globs }}
        # Needed for the sticky PR comment (GithubProvider.postStickyComment). GITHUB_EVENT_PATH,
        # GITHUB_REPOSITORY, GITHUB_EVENT_NAME, GITHUB_ACTIONS are already set by the runner for
        # every step - the CLI's github provider reads those directly, nothing to pass here.
        GITHUB_TOKEN: ${{ github.token }}
      run: npx --yes --package="@contexer-ai/contexer-check@${{ steps.pin.outputs.version }}" -c "contexer-check"
