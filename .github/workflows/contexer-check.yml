name: Contexer Check

on:
  pull_request:

# R19: without this, two rapid pushes to the same PR can post a duplicate comment or let a
# stale (older-sha) run PATCH over a newer score.
concurrency:
  group: contexer-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write # needed to post/update the sticky comment
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # This repo is PUBLIC, so most outside contributions arrive as fork PRs, where secrets are
    # empty and GITHUB_TOKEN is read-only. The CLI already neutral-skips that case (R16), but
    # gating the whole job avoids spending runner minutes to reach that conclusion.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # R1: fetch-depth: 0 (full history). The CLI self-heals a shallow checkout (it fetches the
      # PR's base sha and deepens in a bounded loop before falling back to a two-dot diff), but
      # full history is the reliable path and avoids that fallback entirely.
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      # Pinned to a full commit SHA rather than this repo's usual exact-version-tag convention:
      # this step runs immediately before the credential-bearing CLI step below (Anthropic key +
      # Contexer CI token in env), so a moved upstream tag must not silently change the code that
      # prepares that runner. SHA = actions/setup-node v4; bump deliberately.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # R20: always pin the exact published version - never run this unpinned in CI. Keep in
      # lockstep with the npm package (@contexer-ai/contexer-check) and the contexer-teams
      # action/docs pins; they are bumped together.
      #
      # continue-on-error implements the advisory promise (R18): a registry/network outage while
      # installing must not turn this check red. The CLI's own exit codes are advisory here anyway
      # (no CONTEXER_FAIL_BELOW set). DROP THIS LINE if you ever set fail_below deliberately -
      # otherwise the blocking gate would be swallowed.
      - name: Run contexer-check
        continue-on-error: true
        env:
          CONTEXER_URL: "https://mcp.contexer.ai"
          CONTEXER_CI_TOKEN: ${{ secrets.CONTEXER_CI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Python-repo noise on top of the CLI's built-in (JS-oriented) ignore set, so generated
          # files never eat the judge's diff budget or burn tokens.
          CONTEXER_IGNORE_GLOBS: "uv.lock,poetry.lock,.venv/**,__pycache__/**,*.pyc,htmlcov/**,.coverage"
          # Needed for the sticky PR comment; the runner sets the other GITHUB_* vars the CLI reads.
          GITHUB_TOKEN: ${{ github.token }}
          # CONTEXER_FAIL_BELOW: "70"   # uncomment to block merges below a score of 70
        run: npx --yes --package="@contexer-ai/contexer-check@0.3.0" -c "contexer-check"
