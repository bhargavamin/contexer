name: Tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "assets/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  # Everything except tests/test_bench_*.py (~45s of stubbed benchmark harness).
  correctness:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      # No --cov-fail-under here — the floor lives in pyproject addopts so the
      # convention miner can see it (see the comment there before moving it).
      - name: Run tests with coverage
        run: uv run pytest tests/ -m "not slow and not perf" -v --tb=short

  # Split out so the 45s harness runs ONCE, not once per Python version — not to
  # defer it. Deliberately unconditional: an `if: github.event_name != 'pull_request'`
  # here silently skipped the harness entirely on any branch outside the `push`
  # allowlist above (e.g. `ci/**`), so it ran on neither event. Same push+PR overlap
  # the correctness job already has.
  harness:
    name: Benchmark harness / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run stubbed benchmark harness tests
        run: uv run pytest tests/ -m slow -v --tb=short --no-cov

  # Ruff was already in use locally (a .ruff_cache sits in the tree) but nothing enforced
  # it, so unused imports and dead locals could land unnoticed. Rules live in pyproject's
  # [tool.ruff.lint]; only the runner lives here.
  #
  # Version pinned exactly, and run via uvx rather than the dev group: ruff is a binary we
  # never import, so pinning here keeps uv.lock untouched when it is bumped — and a fresh
  # ruff release can never turn a green PR red on its own. Keep in step with CONTRIBUTING.
  lint:
    # Name carries no version: it is the GitHub check name, so baking 0.15.4 into it would
    # rename the check on every bump and silently stop any branch-protection rule keyed to it.
    name: Lint / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      # `.` and not an explicit path list: ruff honours .gitignore, so .venv and the
      # caches are already out, and a new top-level module is linted the day it lands.
      - name: Run ruff
        run: uvx ruff@0.15.4 check .
