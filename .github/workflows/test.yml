name: Tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "assets/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  # Everything except tests/test_bench_*.py (~45s of stubbed benchmark harness).
  correctness:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            allow-prereleases: true
      # 3.14 is pre-release — failures there don't block the build
    continue-on-error: ${{ matrix.python-version == '3.14' }}

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest tests/ -m "not slow" -v --tb=short

  # Split out so the 45s harness runs ONCE, not once per Python version — not to
  # defer it. It still gates every push; `pull_request` would only duplicate the
  # push run on the same commit.
  harness:
    name: Benchmark harness / Python 3.13
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run stubbed benchmark harness tests
        run: uv run pytest tests/ -m slow -v --tb=short --no-cov
