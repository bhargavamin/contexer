name: Manual publish to PyPI

# Emergency fallback - use only if the release-please workflow fails.
# Normal releases are handled automatically by release-please.yml on merge to main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.6.3)'
        required: true

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      # SHA-pinned, never the `release/v1` BRANCH it used to track: this job carries
      # `id-token: write` (PyPI trusted publishing), so what runs here must not change
      # without a commit. Keep in lockstep with release-please.yml's pin.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Upload dist to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*
